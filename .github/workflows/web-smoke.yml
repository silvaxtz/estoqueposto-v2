name: Web smoke test
on:
  push:
    branches: [web-conversion]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server.cjs
      - run: node --check src/renderer.js
      - run: node --check src/web-api.js
      - run: node scripts/web-smoke-test.cjs
