<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso | Estoque Grupo Atualize</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f8;font:15px Arial,sans-serif;color:#18212d}.box{width:min(92vw,390px);background:#fff;padding:34px;border:1px solid #e4e8ee;border-radius:16px;box-shadow:0 18px 50px #15223812}.brand{text-align:center;margin-bottom:28px;font-weight:700;letter-spacing:.08em}.brand small{display:block;margin-top:8px;color:#788493;font-size:11px}.box h1{font-size:22px;margin:0 0 8px}.box p{color:#687586;margin:0 0 24px}label{display:block;font-weight:600;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid #d8dee7;border-radius:8px;font-size:16px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:#172333;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.error{color:#b42318;min-height:20px;margin-top:12px}</style></head><body><main class="box"><div class="brand">GRUPO ATUALIZE<small>CONTROLE DE ESTOQUE</small></div><h1>Acesso ao sistema</h1><p>Informe a senha para continuar.</p><form id="login"><label for="password">Senha de acesso</label><input id="password" name="password" type="password" required autofocus autocomplete="current-password"><button>Entrar</button><div class="error" id="error" role="alert"></div></form></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const password=new FormData(e.target).get('password');const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const d=await r.json();if(r.ok)location.href='/app';else document.getElementById('error').textContent=d.error||'Não foi possível entrar.'};</script></body></html>
